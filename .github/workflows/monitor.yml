name: iPhone Duo 庫存監控

on:
  schedule:
    - cron: "*/5 * * * *"    # 每 5 分鐘
  workflow_dispatch:          # 手動執行按鈕
    inputs:
      full_report:
        description: "回報完整庫存狀態（手動查詢用）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monitor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 檢查庫存
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FULL_REPORT: ${{ github.event.inputs.full_report || 'false' }}
          PARTS: "MK2D4ZP/A,MK2E4ZP/A,MK2F4ZP/A,MK2G4ZP/A,MK2H4ZP/A,MK2J4ZP/A,MK2K4ZP/A,MK2L4ZP/A"
        run: python monitor.py

      - name: 儲存狀態
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "no change"
          git push || true
